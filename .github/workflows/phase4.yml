name: Phase 4 Linux engine contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: phase4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    # clang-18 is best-effort: it fails today with "no template named
    # 'expected' in namespace 'std'" even with a full g++-14 (including
    # its libstdc++) installed alongside it -- three attempts (missing
    # package, headers-only, full g++-14) all hit the identical error, so
    # this looks like a deeper Clang/libstdc++ incompatibility on this
    # Ubuntu 24.04 image rather than a missing dependency. Not blocking
    # gcc-14 (the required toolchain) on further diagnosis of that; revisit
    # if/when there's time to dig in (try -stdlib=libc++, or an explicit
    # -std=c++23 vs the CMake-selected standard flag).
    continue-on-error: ${{ matrix.toolchain == 'clang-18' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: gcc-14
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - toolchain: clang-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 g++-14 libstdc++-14-dev
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ${{ matrix.packages }} libgtest-dev libgmock-dev libbenchmark-dev libsdl2-dev libsodium-dev libpng-dev libbz2-dev
      - name: Patch engine
        run: python3 scripts/apply-engine-patches.py
      - name: Build engine contracts
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S Engine/devilutionx -B build/phase4 -G Ninja -DBUILD_TESTING=ON -DDEVILUTIONX_SYSTEM_BENCHMARK=OFF
          cmake --build build/phase4 --target rtt_phase4_test -j 2
      - name: Run engine contracts
        working-directory: build/phase4
        run: ./rtt_phase4_test --gtest_output=xml:phase4-results.xml
      - name: Validate completion evidence
        run: python3 scripts/validate-phase4-complete.py --results build/phase4/phase4-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-linux-evidence-${{ matrix.toolchain }}
          path: build/phase4/phase4-results.xml
