name: Windows MSVC baseline build

on:
  pull_request:
    paths:
      - 'Engine/**'
      - '.gitmodules'
      - 'scripts/build-windows.ps1'
      - 'scripts/runtime-acceptance.ps1'
      - 'scripts/phase3-acceptance-evidence.ps1'
      - 'scripts/package-windows-test.ps1'
      - 'scripts/apply-engine-patches.py'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [ main ]
    paths:
      - 'Engine/**'
      - '.gitmodules'
      - 'scripts/build-windows.ps1'
      - 'scripts/runtime-acceptance.ps1'
      - 'scripts/phase3-acceptance-evidence.ps1'
      - 'scripts/package-windows-test.ps1'
      - 'scripts/apply-engine-patches.py'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_FEATURE_FLAGS: dependencygraph
      VCPKG_DISABLE_METRICS: 1
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      RTT_SOL2_SOURCE: ${{ github.workspace }}/deps/sol2
    steps:
      - name: Checkout RTT and pinned DevilutionX
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Parse Windows PowerShell harnesses
        shell: pwsh
        run: |
          foreach ($path in @('scripts/runtime-acceptance.ps1', 'scripts/phase3-acceptance-evidence.ps1', 'scripts/package-windows-test.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List
              throw "$path contains PowerShell parse errors."
            }
            Write-Host "$path parses successfully."
          }

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Cache pinned vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-40f3c709db80acf154ac4b17a1f83c564ebd022e

      - name: Setup pinned vcpkg with retry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '40f3c709db80acf154ac4b17a1f83c564ebd022e'
          $root = $env:VCPKG_ROOT

          if ((Test-Path (Join-Path $root 'vcpkg.exe')) -and (Test-Path (Join-Path $root '.git'))) {
            $current = (git -C $root rev-parse HEAD).Trim()
            if ($current -eq $commit) {
              Write-Host "Using cached vcpkg $commit"
              exit 0
            }
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              if (Test-Path $root) {
                Remove-Item -Recurse -Force $root
              }

              git clone --no-checkout https://github.com/microsoft/vcpkg.git $root
              if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed with exit code $LASTEXITCODE" }

              git -C $root checkout --force $commit
              if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed with exit code $LASTEXITCODE" }

              & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
              if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }

              Write-Host "Pinned vcpkg is ready: $commit"
              exit 0
            }
            catch {
              Write-Warning "vcpkg setup attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

      - name: Cache pinned sol2
        uses: actions/cache@v4
        with:
          path: deps/sol2
          key: sol2-${{ runner.os }}-832ac772c2cd3d9620d447e9e77897f7b5e806e3

      - name: Prefetch pinned sol2 with retry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '832ac772c2cd3d9620d447e9e77897f7b5e806e3'
          $root = $env:RTT_SOL2_SOURCE

          if ((Test-Path (Join-Path $root 'CMakeLists.txt')) -and (Test-Path (Join-Path $root '.git'))) {
            $current = (git -C $root rev-parse HEAD).Trim()
            if ($current -eq $commit) {
              Write-Host "Using cached sol2 $commit"
              exit 0
            }
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              if (Test-Path $root) {
                Remove-Item -Recurse -Force $root
              }
              New-Item -ItemType Directory -Force $root | Out-Null

              git -C $root init
              if ($LASTEXITCODE -ne 0) { throw "sol2 init failed with exit code $LASTEXITCODE" }
              git -C $root remote add origin https://github.com/diasurgical/sol2.git
              if ($LASTEXITCODE -ne 0) { throw "sol2 remote setup failed with exit code $LASTEXITCODE" }

              git -C $root fetch --depth=1 origin $commit
              if ($LASTEXITCODE -ne 0) { throw "sol2 fetch failed with exit code $LASTEXITCODE" }
              git -C $root checkout --detach --force FETCH_HEAD
              if ($LASTEXITCODE -ne 0) { throw "sol2 checkout failed with exit code $LASTEXITCODE" }

              $current = (git -C $root rev-parse HEAD).Trim()
              if ($current -ne $commit) { throw "sol2 resolved to $current instead of $commit" }

              Write-Host "Pinned sol2 is ready: $commit"
              exit 0
            }
            catch {
              Write-Warning "sol2 setup attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

      - name: Verify pinned engine baseline
        shell: pwsh
        run: python scripts/verify-baseline.py

      - name: Build pinned DevilutionX with Visual Studio MSVC
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          $lastCode = 1
          $engine = 'Engine/devilutionx'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              # build-windows.ps1 applies the RTT patch stack in-place. Always
              # restore the pinned submodule before a retry so a failed compile
              # cannot poison the next attempt with an already-patched tree.
              git -C $engine reset --hard HEAD
              if ($LASTEXITCODE -ne 0) { throw "Engine reset failed with exit code $LASTEXITCODE" }
              git -C $engine clean -fd
              if ($LASTEXITCODE -ne 0) { throw "Engine clean failed with exit code $LASTEXITCODE" }

              & ./scripts/build-windows.ps1 -Configuration Release -VcpkgRoot $env:VCPKG_ROOT -Sol2Source $env:RTT_SOL2_SOURCE
              $lastCode = $LASTEXITCODE
            }
            catch {
              $lastCode = 1
              Write-Warning "Build attempt $attempt raised: $($_.Exception.Message)"
            }

            if ($lastCode -eq 0) {
              Write-Host "Build succeeded on attempt $attempt"
              exit 0
            }

            Write-Warning "Build attempt $attempt failed with exit code $lastCode"
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit $lastCode

      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats

      - name: Verify executable
        shell: pwsh
        run: |
          $candidates = @(
            'build/devilutionx-windows-x64/Release/devilutionx.exe',
            'build/devilutionx-windows-x64/devilutionx.exe'
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Missing devilutionx.exe in expected build output." }
          Get-Item $exe | Select-Object FullName, Length

      - name: Phase 4 engine contracts
        shell: pwsh
        run: |
          $test = Resolve-Path 'build/devilutionx-windows-x64/Release/rtt_phase4_test.exe'
          # DevilutionX resolves unpacked assets relative to the executable's own
          # directory (SDL_GetBasePath() + "assets/"), but CMake's copy_files()
          # always stages them at the base build dir, not inside the per-config
          # Release/Debug subdirectory MSVC uses. Mirror them alongside the test
          # binary so it can find txtdata/items/itemdat.tsv etc.
          Copy-Item -Recurse -Force 'build/devilutionx-windows-x64/assets' 'build/devilutionx-windows-x64/Release/assets'
          Push-Location build/devilutionx-windows-x64
          & $test --gtest_output=xml:phase4-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Phase 4 engine contracts failed' }
          Pop-Location
          python scripts/validate-phase4-complete.py --results build/devilutionx-windows-x64/phase4-results.xml

      - name: Package RTT Windows x64 test build
        shell: pwsh
        run: ./scripts/package-windows-test.ps1 -Configuration Release

      - name: Verify packaged test ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem 'out/windows-test-build/*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Missing RTT Windows test ZIP.' }
          Write-Host "Package: $($zip.FullName)"
          Write-Host "SHA256: $((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)"

      - name: Upload RTT Windows x64 test build
        uses: actions/upload-artifact@v4
        with:
          name: rtt-windows-x64-test
          path: out/windows-test-build/*.zip
          if-no-files-found: error
          retention-days: 14
