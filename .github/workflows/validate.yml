name: Validate RTT foundation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with DevilutionX baseline
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify pinned DevilutionX baseline
        run: python scripts/verify-baseline.py

      - name: Verify RTT engine patches apply cleanly
        run: python scripts/apply-engine-patches.py --check

      - name: Validate RTT source data
        run: python scripts/validate-data.py

      - name: Validate Phase 2 RTT Mod Framework
        run: python scripts/validate-phase2-framework.py

      - name: Validate Phase 3 Classic+ baseline
        run: python scripts/validate-classic-plus.py

      - name: Validate Loot Filter 2.0
        run: python scripts/validate-loot-filter.py

      - name: Validate item comparison tooltip
        run: python scripts/validate-item-tooltip.py

      - name: Validate weapon swap
        run: python scripts/validate-weapon-swap.py

      - name: Validate Phase 3 engineering completion
        run: python scripts/validate-phase3-complete.py

      - name: Generate runtime tables
        run: python scripts/export-mod-data.py --output out/ci-mod

      - name: Generate runtime framework contract
        run: python scripts/generate-framework-data.py --output out/ci-mod

      - name: Validate generated Experience table
        run: |
          test -f out/ci-mod/txtdata/Experience.tsv
          grep -q $'^Level\tExperience$' out/ci-mod/txtdata/Experience.tsv
          grep -q $'^1\t2000$' out/ci-mod/txtdata/Experience.tsv

      - name: Validate Classic+ starter gold
        run: |
          grep -q $'^gold\t200$' out/ci-mod/txtdata/classes/warrior/starting_loadout.tsv
          grep -q $'^gold\t200$' out/ci-mod/txtdata/classes/rogue/starting_loadout.tsv
          grep -q $'^gold\t200$' out/ci-mod/txtdata/classes/sorcerer/starting_loadout.tsv

      - name: Validate generated Phase 2 runtime contract
        run: |
          test -f out/ci-mod/lua/mods/rtt/generated/content_ids.lua
          test -f out/ci-mod/lua/mods/rtt/generated/contract.lua
          grep -q 'frameworkVersion = 1' out/ci-mod/lua/mods/rtt/generated/contract.lua
          grep -q 'saveSchemaVersion = 1' out/ci-mod/lua/mods/rtt/generated/contract.lua
          grep -q 'networkProtocolVersion = 1' out/ci-mod/lua/mods/rtt/generated/contract.lua

      - name: Validate RTT loot filter runtime files
        run: |
          test -f packaging/mod/lua/mods/rtt/qol/loot_filter.lua
          test -f packaging/mod/lua/mods/rtt/qol/loot_filter_config.lua
          grep -q 'ShouldShowItemLabel' packaging/mod/lua/mods/rtt/modules/qol.lua
          grep -q 'preset = "balanced"' packaging/mod/lua/mods/rtt/qol/loot_filter_config.lua
          grep -q 'strict = {' packaging/mod/lua/mods/rtt/qol/loot_filter.lua

      - name: Validate runtime manifest
        run: |
          test -f packaging/mod/manifest.ini
          grep -q '^programId=RTRM$' packaging/mod/manifest.ini
          grep -q '^saveExtension=rtt$' packaging/mod/manifest.ini

      - name: Validate RTT version consistency
        run: |
          test -f VERSION
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          manifest_version="$(sed -n 's/^version=//p' packaging/mod/manifest.ini | tr -d '\r\n')"
          test "$manifest_version" = "$version"
          grep -q "Current development version: \`$version\`" docs/VERSIONING.md

      - name: Validate Phase 1 runtime acceptance harness
        run: python scripts/validate-runtime-harness.py
